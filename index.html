<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
MELBA - Daily Maintenance Records
</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #f1f4f8;

    color: #222;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 96%;

    max-width: 1600px;

    margin: 25px auto;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    background: #1f4e78;

    color: white;

    padding: 22px;

    border-radius: 8px 8px 0 0;

}


.header h1 {

    margin: 0;

    font-size: 25px;

}


.header p {

    margin: 7px 0 0;

    font-size: 15px;

}


/* =========================================================
   CONTROL AREA
========================================================= */

.controls {

    background: white;

    padding: 15px;

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    align-items: center;

    border-bottom: 1px solid #ddd;

}


.search-box {

    flex: 1;

    min-width: 250px;

}


.search-box input {

    width: 100%;

    padding: 11px;

    border: 1px solid #bbb;

    border-radius: 5px;

    font-size: 14px;

}


button {

    border: none;

    border-radius: 5px;

    padding: 11px 18px;

    cursor: pointer;

    font-weight: bold;

}


.refresh-btn {

    background: #198754;

    color: white;

}


.refresh-btn:hover {

    opacity: .85;

}


/* =========================================================
   TOTAL
========================================================= */

.total {

    background: white;

    padding: 15px;

    border-bottom: 1px solid #ddd;

    font-weight: bold;

}


#totalRecords {

    color: #1f4e78;

}


/* =========================================================
   ERROR
========================================================= */

.error {

    display: none;

    background: #f8d7da;

    color: #842029;

    padding: 15px;

    margin: 15px 0;

    border-radius: 5px;

}


/* =========================================================
   TABLE
========================================================= */

.table-container {

    background: white;

    overflow-x: auto;

}


table {

    width: 100%;

    min-width: 1300px;

    border-collapse: collapse;

}


thead th {

    background: #1f4e78;

    color: white;

    padding: 12px;

    text-align: left;

    white-space: nowrap;

    position: sticky;

    top: 0;

}


tbody td {

    padding: 10px;

    border-bottom: 1px solid #ddd;

    vertical-align: top;

}


tbody tr:hover {

    background: #f3f7fa;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-block;

    padding: 5px 10px;

    border-radius: 15px;

    font-size: 12px;

    font-weight: bold;

}


.status-pending {

    background: #fff3cd;

    color: #856404;

}


.status-completed {

    background: #d1e7dd;

    color: #0f5132;

}


.status-in-progress {

    background: #cff4fc;

    color: #055160;

}


.status-cancelled {

    background: #f8d7da;

    color: #842029;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    text-align: center;

    padding: 35px;

    font-weight: bold;

    color: #555;

}


.no-data {

    text-align: center;

    padding: 35px;

    color: #777;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .container {

        width: 100%;

        margin: 0;

    }


    .header {

        border-radius: 0;

    }


    .header h1 {

        font-size: 20px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <h1>
            MELBA PRINTING & PUBLISHING
        </h1>

        <p>
            Daily Maintenance Records
        </p>

    </div>



    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div class="controls">


        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search equipment, technician, work description..."
            >

        </div>


        <button
            class="refresh-btn"
            onclick="loadData()">

            🔄 Refresh

        </button>


    </div>



    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        id="errorBox"
        class="error">
    </div>



    <!-- =====================================================
         TOTAL RECORDS
    ====================================================== -->

    <div class="total">

        Total Maintenance Records:

        <span id="totalRecords">
            0
        </span>

    </div>



    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="table-container">

        <table>


            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Time
                    </th>

                    <th>
                        Equipment ID
                    </th>

                    <th>
                        Equipment Name
                    </th>

                    <th>
                        Technician
                    </th>

                    <th>
                        Work Type
                    </th>

                    <th>
                        Priority
                    </th>

                    <th>
                        Work Description
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Remarks
                    </th>

                    <th>
                        Saved At
                    </th>

                </tr>

            </thead>



            <tbody id="tableBody">

                <tr>

                    <td
                        colspan="12"
                        class="loading">

                        Loading maintenance records...

                    </td>

                </tr>

            </tbody>


        </table>

    </div>


</div>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

const API_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQdXkuYY9Tl-Jxf_xRJ1tnnSKNYY8AvmY_whn8zsLORjiOLJXipsxuLwFLkzLUUgrPLJGRB7LljUgv/pubhtml?gid=0&single=true";


/* =========================================================
   SECURITY TOKEN
========================================================= */

const TOKEN =
    "MELBA2026";


/* =========================================================
   STORE ALL DATA
========================================================= */

let allData = [];



/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {


    const tableBody =
        document.getElementById(
            "tableBody"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    // Hide previous error

    errorBox.style.display =
        "none";


    // Show loading

    tableBody.innerHTML = `

        <tr>

            <td
                colspan="12"
                class="loading">

                Loading maintenance records...

            </td>

        </tr>

    `;


    try {


        /* =================================================
           SEND GET REQUEST
        ================================================= */

        const response =
            await fetch(

                API_URL +
                "?token=" +
                encodeURIComponent(TOKEN)

            );


        /* =================================================
           CONVERT RESPONSE TO JSON
        ================================================= */

        const result =
            await response.json();


        /* =================================================
           CHECK RESPONSE
        ================================================= */

        if (!result.ok) {

            throw new Error(

                result.error ||
                "Unable to load data"

            );

        }


        /* =================================================
           STORE DATA
        ================================================= */

        allData =
            result.data || [];


        /* =================================================
           DISPLAY DATA
        ================================================= */

        displayData(
            allData
        );


    }

    catch (error) {


        console.error(error);


        errorBox.innerText =
            "Error: " +
            error.message;


        errorBox.style.display =
            "block";


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    class="no-data">

                    Unable to load Google Sheet data.

                </td>

            </tr>

        `;


        document.getElementById(
            "totalRecords"
        ).innerText = "0";

    }

}



/* =========================================================
   DISPLAY DATA
========================================================= */

function displayData(data) {


    const tableBody =
        document.getElementById(
            "tableBody"
        );


    /* =====================================================
       UPDATE TOTAL
    ===================================================== */

    document.getElementById(
        "totalRecords"
    ).innerText =
        data.length;



    /* =====================================================
       NO DATA
    ===================================================== */

    if (data.length === 0) {


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    class="no-data">

                    No maintenance records found.

                </td>

            </tr>

        `;


        return;

    }



    /* =====================================================
       CLEAR TABLE
    ===================================================== */

    tableBody.innerHTML = "";



    /* =====================================================
       ADD EACH RECORD
    ===================================================== */

    data.forEach(function(row) {


        const status =
            row["Status"] ||
            "Pending";


        const statusClass =
            getStatusClass(
                status
            );


        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

            <td>
                ${safe(row["ID"])}
            </td>

            <td>
                ${safe(row["Date"])}
            </td>

            <td>
                ${safe(row["Time"])}
            </td>

            <td>
                ${safe(row["Equipment ID"])}
            </td>

            <td>
                ${safe(row["Equipment Name"])}
            </td>

            <td>
                ${safe(row["Technician"])}
            </td>

            <td>
                ${safe(row["Work Type"])}
            </td>

            <td>
                ${safe(row["Priority"])}
            </td>

            <td>
                ${safe(row["Work Description"])}
            </td>

            <td>

                <span
                    class="status ${statusClass}">

                    ${safe(status)}

                </span>

            </td>

            <td>
                ${safe(row["Remarks"])}
            </td>

            <td>
                ${safe(row["Saved At"])}
            </td>

        `;


        tableBody.appendChild(
            tr
        );

    });

}



/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status) {


    const value =
        String(status)
            .toLowerCase()
            .trim();


    if (
        value === "completed" ||
        value === "complete"
    ) {

        return "status-completed";

    }


    if (
        value === "in progress" ||
        value === "in-progress"
    ) {

        return "status-in-progress";

    }


    if (
        value === "cancelled" ||
        value === "canceled"
    ) {

        return "status-cancelled";

    }


    return "status-pending";

}



/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {


            const keyword =
                this.value
                    .toLowerCase()
                    .trim();


            /* =============================================
               SHOW EVERYTHING
            ============================================= */

            if (!keyword) {

                displayData(
                    allData
                );

                return;

            }


            /* =============================================
               FILTER
            ============================================= */

            const filtered =
                allData.filter(
                    function(row) {


                        return Object
                            .values(row)
                            .join(" ")
                            .toLowerCase()
                            .includes(
                                keyword
                            );


                    }
                );


            /* =============================================
               DISPLAY FILTERED DATA
            ============================================= */

            displayData(
                filtered
            );

        }
    );



/* =========================================================
   HTML SECURITY
========================================================= */

function safe(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   LOAD DATA WHEN PAGE OPENS
========================================================= */

loadData();


</script>


</body>

</html>
